<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Study Sprint Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <a href="#main_content" class="skip-link">Skip to main content</a>
    <header>
        <h1>Study Sprint Planner</h1>
        
    </header>
    <main id="main_content">
    <section class="new-sprint-card">
        <header class="add-header">
                <h2>New Sprint</h2>
        </header>
        <form class="add-sprint">
            <div class="form-group">
                <label for="sprint-name-label">Name</label>
                <textarea id="sprint-name" name="sprint-name" class="sprint-name-area" required></textarea>
            </div>
            <div class="form-group">
                <label for="sprint-desc-label">Description</label>
                <textarea id="sprint-desc" name="sprint-desc" class="sprint-desc-area" required></textarea>
            </div>
            <div class="priority-cont">
                <div class="priority-circles">
                    <span class="priority">Priority</span>
                    <button type="button" class="priority-btn pr0">0</button>
                    <button type="button" class="priority-btn pr1">1</button>
                    <button type="button" class="priority-btn pr2">2</button>
                    <button type="button" class="priority-btn pr3">3</button>
                    <button type="button" class="priority-btn pr4">4</button>
                    <button type="button" class="priority-btn pr5">5</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">CREATE SPRITE +</button>
        </form>
    </section>

    <div class="sprint-board">
        <section class="board-column c0">
            <header class="column-header">
                <h3>Sprinted (2)</h3>
            </header>
            <div class="column-content">
                <article class="sprint-card sc2">
                    <div class="card-inner">
                        <svg class="dropdown-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4V10C4 12.2091 5.79086 14 8 14H20M20 14L16 10M20 14L16 18" 
                                stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                        <h4>ASD Test SPRINT</h4>
                        <div class="delete-button">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 6H5H21M19 6V19C19 20.1046 18.1046 21 17 21H7C5.89543 21 5 20.1046 5 19V6M8 6V4C8 2.89543 8.89543 2 10 2H14C15.1046 2 16 2.89543 16 4V6" 
                                    stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            </svg>
                        </div>
                        <div class="priority-circle">2</div>
                    </div>
                </article>
            </div>
        </section>

        <section class="board-column c1">
            <header class="column-header">
                <h3>Current Sprint (3)</h3>
            </header>
            <div class="column-content">
            </div>
        </section>

        <section class="board-column c2">
            <header class="column-header">
                <h3>Next Sprint (4)</h3>
            </header>
            <div class="column-content">
            </div>
        </section>
    </div>
    </main>
    <div class="bottom-nav">
        <nav>
            <ul>
                <li><a href="about.html">About me & Project</a></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </nav>
    </div>
<script src="sprint.js"></script>
</body>
</html>
